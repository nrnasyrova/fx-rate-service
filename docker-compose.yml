services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      MIGRATIONS_DIR: "/app/migrations"
      POSTGRES_DSN: "postgres://postgres:postgres@postgres:5432/fx_rate_service?sslmode=disable"
      RATE_PROVIDER_BASE_URL: "https://api.exchangeratesapi.io"
      RATE_PROVIDER_ACCESS_TOKEN: "${RATE_PROVIDER_ACCESS_TOKEN}"
      REFRESH_WORKER_NUM: "4"
      REFRESH_WORKER_QUEUE_SIZE: "50"
      REFRESH_SWEEP_INTERVAL: "30s"
      REFRESH_STALE_AFTER: "5m"
      APP_ENV: "production"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fx_rate_service
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fx_rate_service"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata: